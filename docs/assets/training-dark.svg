<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="Training underway since 6 October 2026: Ozen&#x27;s speech model is learning to hear better from across a room and through noise, and the models will keep improving over time. It trains on 265,000 hand-checked Hebrew clips heard through 60,000 simulated rooms; a new version ships only when it beats the current one on a fixed exam; $1.99 an hour on a rented RTX PRO 6000, paid from donated GPU credit.">
  <rect width="1280" height="400" rx="24" fill="#152233" stroke="#2a3d55" stroke-width="2"/>
  <rect x="48" y="38" width="138" height="30" rx="15" fill="#ffc928"/>
  <text x="117" y="59" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#14202e" text-anchor="middle">UNDERWAY</text>
  <text x="202" y="61" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#a9b7c8" text-anchor="start">since 6 October 2026</text>
  <text x="48" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff" text-anchor="start">Teaching Ozen to hear across the room</text>
  <text x="48" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#a9b7c8" text-anchor="start">We&#x27;re training Ozen&#x27;s speech model to hear better far away and through noise. The models will keep improving over time.</text>
  <rect x="48" y="186" width="284" height="166" rx="16" fill="#1b2c42" stroke="#2a3d55" stroke-width="1.5"/>
  <text x="70" y="226" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#ffffff" text-anchor="start">What it learns</text>
  <text x="70" y="262" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#a9b7c8" text-anchor="start">To hear from across a room,</text>
  <text x="70" y="288" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#a9b7c8" text-anchor="start">over the TV and the kitchen,</text>
  <text x="70" y="314" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#a9b7c8" text-anchor="start">not just up close.</text>
  <rect x="348" y="186" width="284" height="166" rx="16" fill="#1b2c42" stroke="#2a3d55" stroke-width="1.5"/>
  <text x="370" y="226" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#ffffff" text-anchor="start">How</text>
  <text x="370" y="262" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#a9b7c8" text-anchor="start">265,000 hand-checked Hebrew</text>
  <text x="370" y="288" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#a9b7c8" text-anchor="start">clips, heard through 60,000</text>
  <text x="370" y="314" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#a9b7c8" text-anchor="start">simulated rooms and noises.</text>
  <rect x="648" y="186" width="284" height="166" rx="16" fill="#1b2c42" stroke="#2a3d55" stroke-width="1.5"/>
  <text x="670" y="226" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#ffffff" text-anchor="start">When it ships</text>
  <text x="670" y="262" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#a9b7c8" text-anchor="start">Only when a new version</text>
  <text x="670" y="288" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#a9b7c8" text-anchor="start">beats the current one on a</text>
  <text x="670" y="314" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#a9b7c8" text-anchor="start">fixed listening exam.</text>
  <rect x="948" y="186" width="284" height="166" rx="16" fill="#1b2c42" stroke="#2a3d55" stroke-width="1.5"/>
  <text x="970" y="226" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#ffc928" text-anchor="start">The cost</text>
  <text x="970" y="262" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#a9b7c8" text-anchor="start">$1.99 an hour on a rented</text>
  <text x="970" y="288" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#a9b7c8" text-anchor="start">RTX PRO 6000, paid from</text>
  <text x="970" y="314" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#a9b7c8" text-anchor="start">donated GPU credit.</text>
</svg>
