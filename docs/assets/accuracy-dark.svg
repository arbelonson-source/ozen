<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="530" viewBox="0 0 1280 530" role="img" aria-label="Words written wrong, lower is better: on lecture speech ivrit.ai Turbo 6.6%, OpenAI Turbo 9.7%, OpenAI Small 27%; on read sentences 21%, 31% and 48%.">
