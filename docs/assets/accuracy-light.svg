<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="334" viewBox="0 0 1280 334" role="img" aria-label="Words written wrong on 30 recorded lecture clips, lower is better: ivrit.ai Turbo 6.6%, OpenAI Turbo 9.7%, OpenAI Small 27%.">
  <rect width="1280" height="334" rx="24" fill="#fffaf0" stroke="#efdcab" stroke-width="2"/>
  <text x="48" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#14202e" text-anchor="start">Words written wrong</text>
  <text x="48" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#566373" text-anchor="start">Lower is better. The same 30 recorded university lecture clips through each model, measured before the phone's 8-bit compression.</text>
  <line x1="670.0" y1="132" x2="670.0" y2="278" stroke="#f0e6cc" stroke-width="2"/>
  <text x="670.0" y="304" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#566373" text-anchor="middle">10%</text>
  <line x1="930.0" y1="132" x2="930.0" y2="278" stroke="#f0e6cc" stroke-width="2"/>
  <text x="930.0" y="304" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#566373" text-anchor="middle">20%</text>
  <line x1="1190.0" y1="132" x2="1190.0" y2="278" stroke="#f0e6cc" stroke-width="2"/>
  <text x="1190.0" y="304" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#566373" text-anchor="middle">30%</text>
  <text x="48" y="161" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#14202e" text-anchor="start">ivrit.ai Turbo</text>
  <rect x="410" y="140" width="171.6" height="30" rx="8" fill="#e0a100"/>
  <text x="593.6" y="161" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#14202e" text-anchor="start">6.6%</text>
  <text x="180" y="161" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#566373" text-anchor="start">recommended, on the phone</text>
  <text x="48" y="205" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#566373" text-anchor="start">OpenAI Turbo</text>
  <rect x="410" y="184" width="252.2" height="30" rx="8" fill="#c3cad3"/>
  <text x="674.2" y="205" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#14202e" text-anchor="start">9.7%</text>
  <text x="48" y="249" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#566373" text-anchor="start">OpenAI Small</text>
  <rect x="410" y="228" width="702.0" height="30" rx="8" fill="#c3cad3"/>
  <text x="1124.0" y="249" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#14202e" text-anchor="start">27%</text>
