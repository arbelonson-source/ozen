<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="650" viewBox="0 0 1280 650" role="img" aria-label="Training underway: words written wrong today, the score a new model must beat: News, clean 8.7%; News, across a room 16.4%; News, far away in a noisy room 29.9%; News, kitchen noise 10.6%; News, a TV talking over it 15.3%. Only the listening half learns, on 265,000 hand-checked Hebrew clips through 60,000 simulated rooms; 8,000 steps, about 4 hours on a rented RTX PRO 6000 at $1.99 an hour, about $8.">
