  <text x="48" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#566373" text-anchor="start">Words written wrong today on a fixed exam, lower is better. The new model&#x27;s bars are added here when the run finishes.</text>
