name: Build sideloadable IPA and Android APK

# Manual only - this is heavier than the per-push CI build (it also has to
# link WhisperKit for a real device architecture, not just the simulator)
# and is only needed when there's actually a new build to put on a phone.
# The iPhone and Android builds run side by side and go out together, in
# one release under one build number.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build the signed Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Build the release APK, signed with Ozen's key
        # Android installs an update only over an app signed with the same
        # key, so every release is signed with the one key kept in the
        # repository's secrets. The version is the iPhone build's: 0.2.N.
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          OZEN_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^ *MARKETING_VERSION: *"\([0-9.]*\)".*/\1/p' ../project.yml | head -n 1)
          if [ -z "$VERSION" ]; then
            echo "MARKETING_VERSION not found in project.yml" >&2
            exit 1
          fi
          export OZEN_KEYSTORE="$RUNNER_TEMP/ozen-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$OZEN_KEYSTORE"
          ./gradlew :core:test :app:testDebugUnitTest :app:assembleRelease \
            -PozenVersionCode=${{ github.run_number }} \
            -PozenVersionName="${VERSION%.*}.${{ github.run_number }}"
          rm -f "$OZEN_KEYSTORE"
      - name: The APK carries the speech code for every processor and Ozen's signature
        working-directory: android
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          bash check-apk.sh "$APK"
          # A missing secret builds an unsigned APK, which no phone installs;
          # another key would lock every phone out of the next update.
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | tee signature.txt
          grep -q "certificate SHA-256 digest: cb25d52af671aa79854c0314e4ca6686ae35524fd0467037222096be9df330ec" signature.txt
          cp "$APK" ../Ozen.apk
      - uses: actions/upload-artifact@v6
        with:
          name: ozen-apk
          path: Ozen.apk
          if-no-files-found: error

  build-ipa:
    name: Build unsigned device IPA
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          # The whole history and its tags, so the release notes can list
          # what changed since the previous build.
          fetch-depth: 0
      - name: Use the newest Xcode 26
        # Liquid Glass (GlassStyle.swift) is compiled only with the iOS 26 SDK,
        # `#if compiler(>=6.2)`. macos-15's default Xcode is 16.x, which builds
        # the app without it and falls back to plain material, and the app then
        # also keeps the pre-iOS 26 look on an iOS 26 phone. So pick Xcode 26 and
        # stop the build if the runner does not have one.
        run: |
          set -euo pipefail
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$XCODE" ]; then
            echo "No Xcode 26 on this runner; the app would build without Liquid Glass." >&2
            ls -d /Applications/Xcode*.app >&2 || true
            exit 1
          fi
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build for a real device, unsigned
        # No code signing here on purpose: this machine has no Apple
        # Developer credentials, and doesn't need any. SideStore/AltStore
        # re-sign the app locally on the phone with the owner's own free
        # Apple ID - that's the whole point of that tool. Building with
        # signing turned off is the standard way to produce an IPA meant
        # to be sideloaded rather than distributed through the App Store.
        run: |
          set -o pipefail
          xcodebuild build \
            -project Ozen.xcodeproj \
            -scheme Ozen \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            2>&1 | tee xcodebuild-release.log | xcpretty
      - name: Package as an .ipa
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/Ozen.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Expected app bundle not found at $APP_PATH" >&2
            find build/Build/Products -maxdepth 2 >&2 || true
            exit 1
          fi
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r -q Ozen.ipa Payload
          ls -la Ozen.ipa
      - uses: actions/upload-artifact@v6
        with:
          name: ozen-ipa
          path: Ozen.ipa
          if-no-files-found: error

  publish:
    name: Publish both as one GitHub Release
    needs: [build-apk, build-ipa]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          # The whole history and its tags, so the release notes can list
          # what changed since the previous build.
          fetch-depth: 0
      - uses: actions/download-artifact@v6
        with:
          name: ozen-ipa
      - uses: actions/download-artifact@v6
        with:
          name: ozen-apk
      - name: Publish as a GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Tagged as a version (v0.2.18 for build 18 of 0.2.0): GitHub
          # orders releases made on the same day by their version, and a
          # tag like build-18 isn't one, so they came out shuffled.
          VERSION=$(sed -n 's/^ *MARKETING_VERSION: *"\([0-9.]*\)".*/\1/p' project.yml | head -n 1)
          if [ -z "$VERSION" ]; then
            echo "MARKETING_VERSION not found in project.yml" >&2
            exit 1
          fi
          TAG="v${VERSION%.*}.${{ github.run_number }}"
          # What changed since the newest earlier build: one line per
          # commit subject, so whoever installs it can see what's new.
          PREVIOUS=$(git tag --list 'v*' --sort=-version:refname | grep -v "^$TAG\$" | head -n 1 || true)
          {
            echo "Ozen.ipa is the iPhone and iPad app: an unsigned device build for sideloading (Impactor, SideStore or AltStore re-sign it with your own Apple ID; it won't install any other way). Ozen.apk is the Android app, for Android 8 or later: open it on the phone and allow installing from that source when asked. Built from commit ${{ github.sha }}; Settings shows ${{ github.run_number }} in brackets after the version on the iPhone, and ${VERSION%.*}.${{ github.run_number }} as the version on Android."
            echo
            if [ -n "$PREVIOUS" ]; then
              echo "## Changes since build ${PREVIOUS##*.}"
              echo
              # Hebrew quoted in a commit subject is replaced with a marker:
              # the repository's pages are kept free of Hebrew text. Tests,
              # documents and the build itself change nothing on the phone,
              # so they're left out of what's new.
              git log --no-merges --pretty='- %s' "$PREVIOUS..${{ github.sha }}" \
                | grep -vE '^- (Tests?|README|Spec|Docs?|CI|Troubleshooting|Sideloading):' \
                | perl -CSD -pe 's/[\x{0590}-\x{05FF}]+(?:[\s,\x{05F3}\x{05F4}"\x27\-]+[\x{0590}-\x{05FF}]+)*/(Hebrew)/g' \
                || true
            fi
          } > release-notes.md
          # --target: without it the tag lands on the default branch's
          # newest commit, not the commit this IPA was built from.
          # The home computer's setup: one file to double-click, which
          # fetches the server from the newest release's zip.
          (cd server && zip -q ../ozen-home-server.zip ozen_server.py pairing.py try_server.py requirements.txt setup-windows.ps1)
          cp server/Ozen-Home-Setup.cmd .
          gh release create "$TAG" Ozen.ipa ozen-home-server.zip Ozen-Home-Setup.cmd Ozen.apk \
            --target "${{ github.sha }}" \
            --title "Ozen build ${{ github.run_number }}" \
            --notes-file release-notes.md \
            --latest
