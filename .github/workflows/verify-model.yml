name: Verify model release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag holding the model's assets"
        required: true
      max_percent:
        description: "Fail above this share of words wrong"
        required: false
        default: "60"

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Download the release's assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release download "$TAG" -R arbelonson-source/ozen-models --dir assets

      - name: Rebuild the model folder from the manifest
        run: python3 scripts/model-release/manifest.py unpack assets model

      - name: Compile the Core ML packages
        run: |
          for package in model/*.mlpackage; do
            xcrun coremlcompiler compile "$package" model
            rm -r "$package"
          done
          ls -la model

      # The tag below must be the release the app is pinned to; on a ref
      # where they differ the check would score the model with speech code
      # the app doesn't run.
      - name: Check WhisperKit matches the app's pin
        run: python3 scripts/check-pinned-libraries.py

      - name: Build WhisperKit's command line
        run: |
          git clone --depth 1 --branch v1.1.1 https://github.com/argmaxinc/argmax-oss-swift.git /tmp/WhisperKit
          cd /tmp/WhisperKit
          swift build -c release --product whisperkit-cli

      - name: Transcribe the Hebrew check clips
        run: |
          mkdir -p report
          for clip in scripts/model-release/clips/*.wav; do
            /tmp/WhisperKit/.build/release/whisperkit-cli transcribe \
              --model-path "$PWD/model" \
              --audio-path "$clip" \
              --language he \
              --skip-special-tokens \
              --without-timestamps \
              --chunking-strategy none \
              | tee "report/$(basename "$clip" .wav).txt"
          done

      - name: Score them
        env:
          MAX_PERCENT: ${{ inputs.max_percent }}
        run: python3 scripts/model-release/wer.py report "$MAX_PERCENT"

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: model-check-report
          path: report
