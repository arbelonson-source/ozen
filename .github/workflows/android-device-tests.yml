name: Android device tests

on:
  push:
    branches: [trial-ci-android-device-tests]
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

concurrency:
  group: android-device-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  API_LEVEL: 35
  SMOKE: >-
    com.arbelonson.ozen.DiagnosticsScreenDeviceTest,
    com.arbelonson.ozen.MobileDataNoteDeviceTest,
    com.arbelonson.ozen.TranscribeDoneDeviceTest,
    com.arbelonson.ozen.NameAlertScreenDeviceTest,
    com.arbelonson.ozen.NameSpeakerDialogDeviceTest,
    com.arbelonson.ozen.WordFixesSectionDeviceTest,
    com.arbelonson.ozen.SharedPatternsDeviceTest,
    com.arbelonson.ozen.LargestTextDeviceTest,
    com.arbelonson.ozen.HomeServerCodeStoreDeviceTest,
    com.arbelonson.ozen.PairingLinkDeviceTest,
    com.arbelonson.ozen.DeviceStorageDeviceTest,
    com.arbelonson.ozen.CaptionsRetryWakeLockDeviceTest,
    com.arbelonson.ozen.ListeningNotificationDeviceTest,
    com.arbelonson.ozen.CaptionScreenDeviceTest#theStatusShowsWhenItIsBusyAndHowFarADownloadIsAndIsNoButtonWhenATapWouldDoNothing,
    com.arbelonson.ozen.CaptionScreenDeviceTest#aStoppedPausedOrOffStatusShowsItsIconInItsOwnColourWhileListeningShowsOnlyTheLiveDot,
    com.arbelonson.ozen.CaptionScreenDeviceTest#aWordTheCaptionsGotWrongGoesFirstInTheWordListFromTheLinesHoldMenuOrTheScreenReader,
    com.arbelonson.ozen.CaptionScreenDeviceTest#savingAFixedWordTellsTheScreenReaderTheLineWasFixedAndCancelSaysNothing

jobs:
  smoke:
    name: Android device tests (emulator smoke subset)
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build the app and its device tests
        working-directory: android
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest -Pandroid.injected.build.abi=x86_64
      - name: Cache the emulator
        id: avd-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}-google_apis-x86_64
      - name: Create the emulator snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Emulator snapshot created."
      - name: Run the smoke subset
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: android
          script: classes=$(echo $SMOKE | tr -d ' '); echo "Device test classes $classes"; ./gradlew :app:connectedDebugAndroidTest -Pandroid.injected.build.abi=x86_64 "-Pandroid.testInstrumentationRunnerArguments.class=$classes"; status=$?; adb logcat -d > app/build/logcat.txt; exit $status
      - name: Count the tests that ran
        if: always()
        working-directory: android
        run: |
          python3 - <<'EOF'
          import glob, sys, xml.etree.ElementTree as ET
          ran = failed = skipped = 0
          for path in glob.glob("app/build/outputs/androidTest-results/connected/**/TEST-*.xml", recursive=True):
              root = ET.parse(path).getroot()
              for suite in [root] if root.tag == "testsuite" else root.iter("testsuite"):
                  ran += int(suite.get("tests", 0))
                  failed += int(suite.get("failures", 0)) + int(suite.get("errors", 0))
                  skipped += int(suite.get("skipped", 0))
          print(f"Device tests: {ran} ran, {failed} failed, {skipped} skipped")
          if ran == 0:
              sys.exit("No device test ran: the class filter matched nothing or the run never started.")
          EOF
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: failure()
        with:
          name: android-device-test-results
          path: |
            android/app/build/outputs/androidTest-results/connected/
            android/app/build/reports/androidTests/connected/
            android/app/build/logcat.txt
          if-no-files-found: ignore
