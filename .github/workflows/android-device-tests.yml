name: Android device tests

# Nightly and by hand from the Actions tab, not on every push: the device
# tests change far less often than the code, and the run holds a runner
# for about ten minutes with a warm cache. By hand, "classes" can name other
# tests, or "all" runs every device test but the whisper package and the
# screen tour (it takes the screenshots), so a full run doesn't need a
# computer with an emulator. A run by hand also gets the three model files
# the tests that need one look for (Base, Small and Ozen's Hebrew model),
# downloaded once from where the app downloads them and kept in the cache.
on:
  workflow_dispatch:
    inputs:
      classes:
        description: >-
          Empty for the smoke subset; "all" for every device test; or
          classes and class#method names, separated by commas
        required: false
        default: ""
  schedule:
    - cron: "17 2 * * *"

concurrency:
  group: android-device-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  API_LEVEL: 35
  PROFILE: pixel_6
  # The Hebrew model needs about 1.7 GB to load (three times its file).
  RAM: 4096M
  # name, URL and SHA-256 as in PhoneModelCatalog.
  MODELS: >-
    ggml-base-q5_1.bin
    https://huggingface.co/ggerganov/whisper.cpp/resolve/5359861c739e955e79d9a303bcbc70fb988958b1/ggml-base-q5_1.bin
    422f1ae452ade6f30a004d7e5c6a43195e4433bc370bf23fac9cc591f01a8898
    ggml-small-q5_1.bin
    https://huggingface.co/ggerganov/whisper.cpp/resolve/5359861c739e955e79d9a303bcbc70fb988958b1/ggml-small-q5_1.bin
    ae85e4a935d7a567bd102fe55afc16bb595bdb618e11b2fc7591bc08120411bb
    ggml-ozen-a3-q5_0.bin
    https://github.com/arbelonson-source/ozen-models/releases/download/model-ozen-turbo-hebrew-a3-ggml-q5_0-1/ggml-ozen-a3-q5_0.bin
    c74b66691f8f97b4a38d43b5d8ee4ec1b32b3951a99520250f36883822c910af
  SMOKE: >-
    com.arbelonson.ozen.DiagnosticsScreenDeviceTest,
    com.arbelonson.ozen.MobileDataNoteDeviceTest,
    com.arbelonson.ozen.TranscribeDoneDeviceTest,
    com.arbelonson.ozen.NameAlertScreenDeviceTest,
    com.arbelonson.ozen.NameSpeakerDialogDeviceTest,
    com.arbelonson.ozen.WordFixesSectionDeviceTest,
    com.arbelonson.ozen.SharedPatternsDeviceTest,
    com.arbelonson.ozen.LargestTextDeviceTest,
    com.arbelonson.ozen.HomeServerCodeStoreDeviceTest,
    com.arbelonson.ozen.PairingLinkDeviceTest,
    com.arbelonson.ozen.DeviceStorageDeviceTest,
    com.arbelonson.ozen.SystemLabelsDeviceTest,
    com.arbelonson.ozen.CaptionsRetryWakeLockDeviceTest,
    com.arbelonson.ozen.ListeningNotificationDeviceTest,
    com.arbelonson.ozen.CaptionScreenDeviceTest#theStatusShowsWhenItIsBusyAndHowFarADownloadIsAndIsNoButtonWhenATapWouldDoNothing,
    com.arbelonson.ozen.CaptionScreenDeviceTest#aStoppedPausedOrOffStatusShowsItsIconInItsOwnColourWhileListeningShowsOnlyTheLiveDot,
    com.arbelonson.ozen.CaptionScreenDeviceTest#aWordTheCaptionsGotWrongGoesFirstInTheWordListFromTheLinesHoldMenuOrTheScreenReader,
    com.arbelonson.ozen.CaptionScreenDeviceTest#savingAFixedWordTellsTheScreenReaderTheLineWasFixedAndCancelSaysNothing,
    com.arbelonson.ozen.CaptionScreenDeviceTest#withThePhonesBuiltInRecognitionOnOfferTheWaitForWiFiOffersCaptionsNowFirst,
    com.arbelonson.ozen.CaptionScreenDeviceTest#aSpeakersNameHeadsTheirRunOfLinesInTheirColourIsSaidOnEveryLineAndGoesWithNamesOff,
    com.arbelonson.ozen.BuiltInRecognitionDeviceTest,
    com.arbelonson.ozen.BuiltInSpeechEngineDeviceTest,
    com.arbelonson.ozen.BuiltInWhileWaitingDeviceTest

jobs:
  smoke:
    name: Android device tests (emulator smoke subset)
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.classes != '' && 150 || 50 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Choose the tests
        env:
          CLASSES: ${{ inputs.classes }}
        run: |
          classes=$(printf '%s' "$CLASSES" | tr -d ' ')
          case "$classes" in
            "") selectors=$(echo $SMOKE | tr -d ' ') ;;
            all) selectors=all ;;
            *[!A-Za-z0-9_.,#]*) echo "Only class names, # and commas, or all: $CLASSES"; exit 1 ;;
            *) selectors=$classes ;;
          esac
          echo "Device tests: $selectors"
          echo "SELECTORS=$selectors" >> "$GITHUB_ENV"
      - name: Cache the model files
        if: inputs.classes != ''
        id: models-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/ozen-models
          key: phone-models-422f1ae4-ae85e4a9-c74b6669
      - name: Download the model files
        if: inputs.classes != '' && steps.models-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/ozen-models
          set -- $MODELS
          while [ $# -ge 3 ]; do
            curl --fail --location --silent --show-error --retry 3 -o ~/ozen-models/"$1" "$2"
            echo "$3  $HOME/ozen-models/$1" | sha256sum --check
            shift 3
          done
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build the app and its device tests
        working-directory: android
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest -Pandroid.injected.build.abi=x86_64
      - name: Cache the emulator
        id: avd-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}-google_apis-x86_64-${{ env.PROFILE }}-${{ env.RAM }}
      - name: Create the emulator snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          profile: ${{ env.PROFILE }}
          ram-size: ${{ env.RAM }}
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Emulator snapshot created."
      - name: Run the device tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          profile: ${{ env.PROFILE }}
          ram-size: ${{ env.RAM }}
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: android
          script: if [ "$SELECTORS" = all ]; then filter="-e package com.arbelonson.ozen -e notPackage com.arbelonson.ozen.whisper,com.arbelonson.ozen.tour"; else filter="-e class $SELECTORS"; fi; ./gradlew -q :app:installDebug :app:installDebugAndroidTest -Pandroid.injected.build.abi=x86_64 && for model in $HOME/ozen-models/*.bin; do [ -f "$model" ] || continue; adb push "$model" /data/local/tmp/ && adb shell "run-as com.arbelonson.ozen sh -c 'mkdir -p files && cp /data/local/tmp/$(basename $model) files/' && rm /data/local/tmp/$(basename $model)" || exit 1; done && adb shell "run-as com.arbelonson.ozen ls -l files" && adb shell am instrument -w -r $filter com.arbelonson.ozen.test/com.arbelonson.ozen.OzenTestRunner > app/build/instrument.txt; status=$?; adb logcat -d > app/build/logcat.txt; exit $status
      - name: Count the tests that ran
        if: always()
        working-directory: android
        run: |
          python3 - <<'EOF'
          import os, pathlib, re, sys
          path = pathlib.Path("app/build/instrument.txt")
          text = path.read_text(errors="replace") if path.exists() else ""
          results, current = [], {}
          for line in text.splitlines():
              if line.startswith("INSTRUMENTATION_STATUS: class="):
                  current["class"] = line.split("=", 1)[1]
              elif line.startswith("INSTRUMENTATION_STATUS: test="):
                  current["test"] = line.split("=", 1)[1]
              elif line.startswith("INSTRUMENTATION_STATUS_CODE: "):
                  code = int(line.split(": ", 1)[1])
                  if code in (0, -1, -2, -3, -4):
                      results.append((current.get("class", "?"), current.get("test", "?"), code))
          failed = [r for r in results if r[1] and r[2] in (-1, -2)]
          skipped = [r for r in results if r[2] in (-3, -4)]
          print(f"Device tests: {len(results)} ran, {len(failed)} failed, {len(skipped)} skipped")
          for cls, test, code in failed:
              print(f"FAILED {cls}#{test}")
          for cls, test, code in skipped:
              print(f"skipped {cls}#{test}")
          finished = re.search(r"^INSTRUMENTATION_CODE: -1", text, re.M) is not None
          if not results:
              sys.exit("No device test ran: the class filter matched nothing or the run never started.")
          ran = {(cls, test) for cls, test, code in results}
          missing = []
          chosen = os.environ["SELECTORS"]
          for selector in ([] if chosen == "all" else chosen.split(",")):
              cls, _, method = selector.partition("#")
              if selector and not any(c == cls and (not method or t == method) for c, t in ran):
                  missing.append(selector)
          for selector in missing:
              print(f"no test ran for {selector}")
          if missing:
              sys.exit(f"{len(missing)} of the chosen tests ran none: renamed or removed?")
          if not finished or "INSTRUMENTATION_FAILED" in text:
              sys.exit("The test run did not finish: the app or the runner crashed (see logcat).")
          if failed:
              sys.exit(f"{len(failed)} device test(s) failed.")
          EOF
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: android-device-test-results
          path: |
            android/app/build/instrument.txt
            android/app/build/logcat.txt
          if-no-files-found: ignore
