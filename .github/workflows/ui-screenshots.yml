name: UI screenshots

on:
  workflow_dispatch:
    inputs:
      device_family:
        description: Simulator device family to run against
        type: choice
        default: iPhone
        options:
          - iPhone
          - iPad
          - iPhone 13 mini
          - App Store iPhone 6.9-inch
          - App Store iPad 13-inch
      test:
        description: Run only this test of OzenScreenshotUITests (e.g. testOnboardingGermanAccessibilityText); empty runs them all
        type: string
        default: ""

jobs:
  screenshots:
    runs-on: macos-15
    # Every test at once, on an iPad, runs well past half an hour.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Use the newest Xcode 26, as the release build does
        # The runner's default Xcode is 16.x: its screenshots showed the
        # iOS 18 look, without the glass buttons every iOS 26 phone has,
        # and a bar too wide for a 375-point phone on iOS 26 (#251) never
        # appeared in them.
        run: |
          set -euo pipefail
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$XCODE" ]; then
            echo "No Xcode 26 on this runner" >&2
            ls -d /Applications/Xcode*.app >&2 || true
            exit 1
          fi
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Find an available iOS Simulator
        id: sim
        run: |
          FAMILY="${{ inputs.device_family || 'iPhone' }}"
          if [ "$FAMILY" = "iPhone 13 mini" ]; then
            # The narrowest phones iOS 26 runs on (375 points: 12 and 13
            # mini, SE) are not among the runner's ready-made simulators.
            RUNTIME=$(xcrun simctl list runtimes available -j \
              | jq -r '[.runtimes[] | select(.name | startswith("iOS"))] | last | .identifier')
            UDID=$(xcrun simctl create "iPhone 13 mini" com.apple.CoreSimulator.SimDeviceType.iPhone-13-mini "$RUNTIME")
            echo "Using simulator: iPhone 13 mini on $RUNTIME ($UDID)"
            echo "udid=$UDID" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The two sizes App Store Connect asks screenshots in.
          case "$FAMILY" in
            "App Store iPhone 6.9-inch") FAMILY="iPhone.*Pro Max" ;;
            "App Store iPad 13-inch") FAMILY="iPad Pro 13" ;;
          esac
          DEVICE=$(xcrun simctl list devices available -j \
            | jq -r --arg family "$FAMILY" '.devices | to_entries[] | .value[] | select(.name | test($family)) | "\(.udid) \(.name)"' \
            | head -n1)
          if [ -z "$DEVICE" ]; then
            echo "No available $FAMILY simulator found" >&2
            xcrun simctl list devices available
            exit 1
          fi
          UDID=${DEVICE%% *}
          echo "Using simulator: ${DEVICE#* } ($UDID)"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Boot the simulator with a tidy status bar
        run: |
          xcrun simctl boot "${{ steps.sim.outputs.udid }}" || true
          xcrun simctl bootstatus "${{ steps.sim.outputs.udid }}"
          xcrun simctl status_bar "${{ steps.sim.outputs.udid }}" override \
            --time 9:41 --batteryState charged --batteryLevel 100 \
            --wifiBars 3 --cellularMode active --cellularBars 4

      - name: Run the screenshot UI tests
        env:
          ONLY_TEST: ${{ inputs.test }}
        run: |
          set -o pipefail
          mkdir -p /tmp/ozen-screenshots
          ONLY=""
          if [ -n "$ONLY_TEST" ]; then
            if ! printf '%s' "$ONLY_TEST" | grep -qE '^test[A-Za-z0-9_]+$'; then
              echo "Not a test name: $ONLY_TEST" >&2
              exit 1
            fi
            ONLY="-only-testing:OzenUITests/OzenScreenshotUITests/$ONLY_TEST"
          fi
          xcodebuild test \
            -project Ozen.xcodeproj \
            -scheme OzenUITests \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            $ONLY \
            2>&1 | tee xcodebuild-raw.log | xcpretty

      - name: Show why it failed
        if: failure()
        run: |
          grep -nE "error:|failed|✘|recorded an issue|Fatal error|crashed|Terminating app|Restarting after unexpected exit|Test session results" xcodebuild-raw.log | head -80 || true
          echo "----- last 80 lines -----"
          tail -n 80 xcodebuild-raw.log

      - name: List what was captured
        if: always()
        run: ls -la /tmp/ozen-screenshots || true

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ui-screenshots
          path: /tmp/ozen-screenshots
          if-no-files-found: error

      - name: Keep the raw test log
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: ui-screenshots-xcodebuild-log
          path: xcodebuild-raw.log
